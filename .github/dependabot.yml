version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /mycore-vue
      - /mycore-viewer
      - /mycore-mets
      - /mycore-acl-editor2
      - /mycore-classeditor
      - /mycore-wcms2
      - /mycore-webtools/src/main/ts/upload
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      maven-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'

dedup.gui.duplicates.table.object1=Object 1
dedup.gui.duplicates.table.object2=Object 2
dedup.gui.duplicates.empty=No possible duplicates were found.
dedup.gui.noDuplicates.description=This list contains the pairs that somebody explicitly confirmed to be two different publications. They are no longer reported as possible duplicates, even if their criteria still match. If a marking is deleted, the pair shows up under "Possible duplicates" again.
dedup.gui.noDuplicates.table.object1=Object 1

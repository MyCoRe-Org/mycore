dedup.gui.title=Duplicate management
dedup.gui.tab.duplicates=Possible duplicates
dedup.gui.tab.noDuplicates=Confirmed non duplicates
dedup.gui.duplicates.description=This list contains pairs of objects that match in at least one criterion, for example in their title or in an identifier. This is only a suspicion, the decision is yours. If both objects really describe the same publication, merge them or delete one of them. If they are two different publications, mark the pair with "No duplicate". It then disappears from this list and is kept under "Confirmed non duplicates".

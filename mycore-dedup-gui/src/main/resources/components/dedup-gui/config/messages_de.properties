dedup.gui.noDuplicates.description=Hier stehen die Paare, die jemand ausdr\u00FCcklich als zwei verschiedene Publikationen best\u00E4tigt hat. Sie werden nicht mehr als m\u00F6gliche Dubletten gemeldet, auch wenn die Kriterien weiterhin \u00FCbereinstimmen. Wird eine Markierung gel\u00F6scht, erscheint das Paar wieder unter "M\u00F6gliche Dubletten".

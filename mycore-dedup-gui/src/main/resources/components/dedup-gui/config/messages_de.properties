dedup.gui.duplicates.description=Hier stehen Paare von Objekten, die in mindestens einem Kriterium \u00FCbereinstimmen, etwa im Titel oder in einem Identifikator. Das ist zun\u00E4chst nur ein Verdacht, die Entscheidung treffen Sie. Handelt es sich tats\u00E4chlich um dieselbe Publikation, f\u00FChren Sie die beiden Objekte zusammen oder l\u00F6schen Sie eines davon. Sind es zwei verschiedene Publikationen, markieren Sie das Paar mit "Keine Dublette". Es verschwindet dann aus dieser Liste und wird k\u00FCnftig unter "Best\u00E4tigte Nicht-Dubletten" gef\u00FChrt.

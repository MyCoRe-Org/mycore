dedup.gui.duplicates.empty=Es wurden keine möglichen Dubletten gefunden.
dedup.gui.noDuplicates.description=Hier stehen die Paare, die jemand ausdrücklich als zwei verschiedene Publikationen bestätigt hat. Sie werden nicht mehr als mögliche Dubletten gemeldet, auch wenn die Kriterien weiterhin übereinstimmen. Wird eine Markierung gelöscht, erscheint das Paar wieder unter "Mögliche Dubletten".

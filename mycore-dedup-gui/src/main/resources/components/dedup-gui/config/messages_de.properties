dedup.gui.tab.noDuplicates=Bestätigte Nicht-Dubletten
dedup.gui.duplicates.description=Hier stehen Paare von Objekten, die in mindestens einem Kriterium übereinstimmen, etwa im Titel oder in einem Identifikator. Das ist zunächst nur ein Verdacht, die Entscheidung treffen Sie. Handelt es sich tatsächlich um dieselbe Publikation, führen Sie die beiden Objekte zusammen oder löschen Sie eines davon. Sind es zwei verschiedene Publikationen, markieren Sie das Paar mit "Keine Dublette". Es verschwindet dann aus dieser Liste und wird künftig unter "Bestätigte Nicht-Dubletten" geführt.
